<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="tile"><rect width="1024" height="1024" rx="228"/></clipPath>
    <clipPath id="pool"><path d="M0 660 C180 630 260 630 380 660 S600 690 720 660 S900 630 1024 660 V1024 H0 Z"/></clipPath>
    <clipPath id="air"><path d="M0 0 H1024 V660 C900 630 820 630 720 660 S500 690 380 660 S180 630 0 660 Z"/></clipPath>
    <linearGradient id="fade" x1="0" y1="660" x2="0" y2="1024" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0.15"/></linearGradient>
    <mask id="fadeMask"><rect width="1024" height="1024" fill="url(#fade)"/></mask>
    <g id="p">
      <rect x="248" y="150" width="172" height="720" rx="86" fill="#B5FC4F"/>
      <circle cx="562" cy="386" r="230" fill="#B5FC4F"/>
      <circle cx="562" cy="386" r="108" fill="#131413"/>
      <circle cx="562" cy="386" r="56" fill="#00C434"/>
    </g>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="#131413"/>
    <!-- the pool -->
    <path d="M0 660 C180 630 260 630 380 660 S600 690 720 660 S900 630 1024 660 V1024 H0 Z" fill="#0F4A24"/>
    <!-- reflection of the bowl -->
    <g clip-path="url(#pool)" mask="url(#fadeMask)" opacity="0.4">
      <use href="#p" transform="translate(0 1320) scale(1 -1)"/>
    </g>
    <!-- submerged stem, seen through the water -->
    <g clip-path="url(#pool)">
      <rect x="264" y="150" width="172" height="720" rx="86" fill="#B5FC4F" opacity="0.55"/>
    </g>
    <!-- the p above water -->
    <g clip-path="url(#air)">
      <use href="#p"/>
    </g>
    <!-- surface -->
    <path d="M0 660 C180 630 260 630 380 660 S600 690 720 660 S900 630 1024 660" fill="none" stroke="#00C434" stroke-width="16" stroke-linecap="round"/>
  </g>
</svg>
